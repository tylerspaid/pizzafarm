services:
  python-app:
    build: ./python-app/
    depends_on:
      - backend
    networks:
      - appnet
  backend:
    build: ./backend/
    ports:
      - "3000:3000"
    networks:
      - appnet
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - appnet

volumes:
  postgres-data:

networks:
  appnet: